---

- name: Sanity check compose
  ansible.builtin.command: docker compose version
  register: compose_check
  changed_when: false
  failed_when: false

- name: Install docker compose plugin if missing
  include_tasks: install_docker.yml
  when: compose_check.rc != 0

- name: Ensure project directory exists
  file:
    path: "/home/{{ start_user }}/dev/"
    state: directory
    owner: devuser
    group: devuser
    mode: '0755'

- name: Clone or update repository
  ansible.builtin.git:
    repo: "{{ general_repo }}"
    dest: "/home/{{ start_user }}/dev/general/"
    version: main
    update: yes
  become: true
  become_user: devuser

- name: Deploy .env file
  ansible.builtin.template:
    src: general.env.j2
    dest: "/home/{{ start_user }}/dev/general/.env"
    owner: root
    group: root
    mode: '0600'

- name: Sanity check database init
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ db_paths }}"
  register: db_checks
  changed_when: false

- name: Sanity check media init
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ media_paths }}"
  register: media_checks
  changed_when: false

- set_fact:
    db_init: "{{ db_checks.results | map(attribute='stat.exists') | min == false }}"
    media_init: "{{ media_checks.results | map(attribute='stat.exists') | min == false }}"

- name: Initialize Database
  include_tasks: init_database.yml
  when: db_init


- name: Initialize Media
  include_tasks: init_media.yml
  when: media_init


- name: Write private key
  copy:
    content: "{{ CERT_KEY | replace('\\n', '\n') | regex_replace('^\"|\"$', '') }}"
    dest: /home/{{ start_user }}/dev/general/nginx/certs/live/petterssonhome.se/privkey.pem
    mode: '0600'


- name: Init usage (JSON)
  ansible.builtin.file:
    path: "/home/{{ start_user }}/media/usage.json"
    state: touch
    owner: "{{ start_user }}"
    group: "{{ start_user }}"
    mode: '0644'
## docker
- name: Deploy compose stack
  community.docker.docker_compose_v2:
    project_src: "/home/{{ start_user }}/dev/general/"
    state: present
    pull: missing
    recreate: auto
  register: compose_result

- name: Show compose output
  ansible.builtin.debug:
    msg: "{{ compose_result }}"

## Logging
- name: Create log location if missing
  ansible.builtin.command: "mkdir -p /home/{{ start_user }}/dev/general/logs"

- name: Create systemd service
  ansible.builtin.copy:
    src: /home/devuser/dev/general/logs/logging.service
    dest: /etc/systemd/system/general_logging.service
    remote_src: true
    owner: "{{ start_user }}"
    group: "{{ start_user }}"
    mode: '0644'

- name: Copy Log Parser service
  ansible.builtin.copy:
    src: /home/devuser/dev/general/logs/logParser.service
    dest: /etc/systemd/system/logParser.service
    remote_src: true
    owner: "{{ start_user }}"
    group: "{{ start_user }}"
    mode: '0644'

- name: Copy Log Parser Timer
  ansible.builtin.copy:
    src: /home/devuser/dev/general/logs/logParser.timer
    dest: /etc/systemd/system/logParser.timer
    remote_src: true
    owner: "{{ start_user }}"
    group: "{{ start_user }}"
    mode: '0644'

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start log parser
  ansible.builtin.systemd:
    name: logParser.timer
    enabled: true
    state: started

- name: Start logging
  ansible.builtin.systemd:
    name: general_logging.service
    enabled: true
    state: started
    
